[project]
name = "rag-eval-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya-Sharma-dev18", email = "sharma.adityaaa0001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.33.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-eval-project = "rag_eval_project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
